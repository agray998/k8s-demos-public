apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app: myapp
  name: myapp
spec:
  serviceName: myapp-headless
  replicas: 3
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      initContainers:
      - image: busybox
        name: init
        volumeMounts:
        - name: statefiles
          mountPath: /var/state
        - name: nginx-conf
          mountPath: /var/conf
        command:
        - /bin/sh
        - -c
        - "cp /var/state/`hostname`.conf /var/conf/nginx.conf"
      containers:
      - image: nginx:alpine
        name: myapp
        volumeMounts:
        - name: nginx-conf
          mountPath: /etc/nginx
      volumes:
      - name: statefiles
        persistentVolumeClaim:
          claimName: myapp-claim
      - name: nginx-conf
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: myapp-headless
  name: myapp-headless
spec:
  clusterIP: None
  ports:
  - port: 80
    protocol: TCP
    targetPort: 80
  selector:
    app: myapp
